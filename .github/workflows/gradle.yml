name: Gradle

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        
    - name: Build
      run: cmd.exe /c gradlew.bat assembleRelease

    - name: Sign
      run: cmd.exe /c java.exe -jar "signer\ApkSigner.jar" sign --key "signer\apkeasytool.pk8" --cert "signer\apkeasytool.pem"  --v4-signing-enabled false --out "%cd%/app/build/outputs/apk/release/youtube_x_signed.apk" "%cd%/app/build/outputs/apk/release/app-release-unsigned.apk"
      
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
          name: YouTube-X
          path: "app/build/outputs/apk/release/youtube_x_signed.apk"

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: app/build/outputs/apk/release/youtube_x_signed.apk
        name: YouTube X ${{ github.ref_name }}
        body: |
          Релиз ${{ github.ref_name }}
          
          - Русский интерфейс
          - Воспроизведение в фоне
          - Убрана шестерёнка настроек
          - Оптимизирована скорость работы
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
